name: Windows desktop app
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AudioConverter --collect-all imageio_ffmpeg app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AudioConverter-Windows
          path: dist/AudioConverter/
